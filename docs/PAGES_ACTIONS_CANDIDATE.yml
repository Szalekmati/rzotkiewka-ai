# CANDIDATE ONLY — reviewable YAML, NOT an active GitHub Actions workflow.
# Kept under docs/. NEVER move to .github/workflows/ or change Pages
# settings without explicit owner approval and a rollback window.
name: RZOTKIEWKA - Pages publication candidate (NOT ACTIVE)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'predictions.json'
      - 'tips.json'
      - 'CNAME'
      - 'lab_forward/ledger.json'
      - 'lab_forward/experiment.json'
      - 'lab_forward/run_status.json'
      - 'lab_forward/RAPORT.md'
      - 'tools/prepare_pages_bundle.py'
      - '.github/workflows/pages_deploy.yml'
  workflow_dispatch:

# Github Pages source must be changed separately in Settings > Pages.
# Until then, this is NOT an active deployment configuration.
permissions:
  contents: read

concurrency:
  group: rzotkiewka-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'Szalekmati/rzotkiewka-ai' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public data and LAB (offline)
        run: |
          python -m unittest discover -s tests -p 'test_site_integrity.py' -v
          python -m unittest discover -s tests -p 'test_lab_readonly_status.py' -v
          python -m unittest discover -s tests -p 'test_pages_bundle.py' -v
      - name: Prepare eight verified public files outside repo
        run: python tools/prepare_pages_bundle.py "$RUNNER_TEMP/rzotkiewka-pages"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only verified public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/rzotkiewka-pages

  deploy:
    needs: build
    if: ${{ github.repository == 'Szalekmati/rzotkiewka-ai' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy artifact from the build job
        id: deployment
        uses: actions/deploy-pages@v4
