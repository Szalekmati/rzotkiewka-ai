name: RZOTKIEWKA - jednorazowy test wrzesniowy aliasow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api_football_holdout_once.yml'
permissions:
  contents: read
concurrency:
  group: rzotkiewka-holdout-once-20261111
  cancel-in-progress: false
jobs:
  holdout-once:
    if: >-
      ${{ github.event.head_commit.message == 'RZOTKIEWKA: uruchom jednokrotny test holdout wrzesien 2026' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy offline
        run: python -m unittest discover -s tests -p 'test_api_football_holdout.py' -v
      - name: Sprawdz wrzesniowy holdout - maksymalnie 4 odczyty
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_holdout.py
