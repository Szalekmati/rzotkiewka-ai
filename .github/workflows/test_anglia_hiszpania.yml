name: RZOTKIEWKA - test Anglia Hiszpania 5 sezonow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-historyczny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz aktualny silnik z repozytorium
        uses: actions/checkout@v4
      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 2.1 na zamrozonej historii Anglii i Hiszpanii
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          Path('snapshot_payload.json').write_text('{"provenance": {"audit_observed_at": "2026-11-09T08:47:57.794263+00:00", "normalized_sha256": "dca5cd3a7bc6757da9888ce69dd00840f4367910dadb0bb238aa342bd461adf5", "source_zip_sha256": "7e903c59352f418e3b233d5e58627d5d95799f706208145f5e01fa59ae0aec9e", "sources": [{"league": "E0", "season": 2021, "url": "https://www.football-data.co.uk/mmz4281/2122/E0.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "335afcbabeb2939fa10ab39ba3e8215072d0b577cb8d0705c1e44c56e934e703", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "E0", "season": 2022, "url": "https://www.football-data.co.uk/mmz4281/2223/E0.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "8442792d3b614c94ea3cf381bd2736805889cc1713169035368fff19c3d02380", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "E0", "season": 2023, "url": "https://www.football-data.co.uk/mmz4281/2324/E0.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "b2e057b0ed959f198b0f63d2391c01239f3608e6de5db68edab3f88e04d07ff3", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "E0", "season": 2024, "url": "https://www.football-data.co.uk/mmz4281/2425/E0.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "d0c8ce4a96d886cf60cf101f570f4a3893844226f91c7bd769eb568c49edbfa4", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "E0", "season": 2025, "url": "https://www.football-data.co.uk/mmz4281/2526/E0.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "3e3a8352f9ada6789c508d6ca184424421fed56a30400904a4a327c583407e62", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "SP1", "season": 2021, "url": "https://www.football-data.co.uk/mmz4281/2122/SP1.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "2d9e619700712823d15716c07715133f8c3b1a09046930dcfc785a38633dee2e", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "SP1", "season": 2022, "url": "https://www.football-data.co.uk/mmz4281/2223/SP1.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "53348112526b5165539df240be350083989bb258f30c0ff7cacbc0165ca7e4b3", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "SP1", "season": 2023, "url": "https://www.football-data.co.uk/mmz4281/2324/SP1.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "5323f596c7ed318e4bce95557a369d809d98501fa499ea5f41350cd45cf3c7d9", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "SP1", "season": 2024, "url": "https://www.football-data.co.uk/mmz4281/2425/SP1.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "c086e96d6a53f6e6c0fce4e35db0d1728c773b4362323da0161a34769e315a36", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}, {"league": "SP1", "season": 2025, "url": "https://www.football-data.co.uk/mmz4281/2526/SP1.csv", "observed_at": "2026-11-09T08:47:57.794263+00:00", "sha256": "4ca2e285f3ee0702f6bc55fcaa4f5a15cb3aef6220735a1d15398131e21d63f5", "matches": 380, "teams": 20, "duplicates": 0, "complete_structure": true, "invalid": 0, "status": "CANDIDATE", "errors": []}]}, "data_gzip_base64": ""}', encoding='utf-8')
          """Offline adapter: frozen candidate results, unchanged forecast_engine 2.1.0."""
          import base64
          import copy
          import csv
          import gzip
          import hashlib
          import importlib.util
          import io
          import json
          import math
          import os
          from collections import Counter, defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          
          ORDER = ('1', 'X', '2')
          EXPECTED_ENGINE = '04eb95eb8ca724140c4a8665c3f9988a3aef15f404b075683afe1989b6490a54'
          LEAD = timedelta(hours=168)
          PUBLICATION_BUFFER = timedelta(hours=24)
          OUT = Path('raport_test_anglia_hiszpania')
          
          
          def load_engine(path):
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != EXPECTED_ENGINE:
                  raise ValueError('forecast_engine.py różni się od sprawdzonej wersji 2.1.0. '
                                   'Nie podmieniaj silnika; prześlij log z aktualnym SHA256: ' + actual)
              spec = importlib.util.spec_from_file_location('rzotkiewka_current', path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              if module.MODEL_VERSION != '2.1.0':
                  raise ValueError('Nieprawidłowa wersja silnika')
              return module
          
          
          def parse_snapshot(data):
              rows = list(csv.DictReader(io.StringIO(data.decode('utf-8'))))
              if len(rows) != 3800:
                  raise ValueError('Oczekiwano 3800 rekordów pięciu pełnych sezonów')
              groups = defaultdict(list)
              for row in rows:
                  league, season = row['league'], int(row['season'])
                  if league not in ('E0', 'SP1') or season not in range(2021, 2026):
                      raise ValueError('Nieoczekiwana liga lub sezon')
                  naive = datetime.strptime(row['date'] + ' ' + row['time'], '%Y-%m-%d %H:%M')
                  if not datetime(season, 7, 1) <= naive < datetime(season + 1, 7, 1):
                      raise ValueError('Data poza sezonem')
                  # Source notes do not explicitly establish a timezone. Use a conservative
                  # interval covering UTC and both candidate European local timezones.
                  variants = [naive.replace(tzinfo=ZoneInfo(zone)).astimezone(timezone.utc)
                              for zone in ('UTC', 'Europe/London', 'Europe/Madrid')]
                  score = [int(row['home_goals']), int(row['away_goals'])]
                  if min(score) < 0 or row['result'] != ('H' if score[0] > score[1] else 'A' if score[0] < score[1] else 'D'):
                      raise ValueError('Niespójny wynik')
                  if not row['home'] or not row['away'] or row['home'] == row['away']:
                      raise ValueError('Nieprawidłowe drużyny')
                  groups[(league, season)].append({
                      'home': row['home'], 'away': row['away'], 'score': score,
                      'earliest': min(variants), 'kickoff': max(variants),
                  })
              if len(groups) != 10:
                  raise ValueError('Niepełne pokrycie sezonów')
              for (league, season), matches in sorted(groups.items()):
                  teams = sorted({m[k] for m in matches for k in ('home', 'away')})
                  pairs = {(m['home'], m['away']) for m in matches}
                  if len(matches) != 380 or len(teams) != 20 or len(pairs) != 380:
                      raise ValueError('Niepełny lub zduplikowany sezon')
                  ids = {name: i + 1 for i, name in enumerate(teams)}
                  matches.sort(key=lambda m: (m['kickoff'], m['home'], m['away']))
                  for i, match in enumerate(matches):
                      match.update(id=i + 1, home_id=ids[match['home']], away_id=ids[match['away']])
              return groups
          
          
          def probabilities(engine, target, matches):
              as_of = target['earliest'] - LEAD
              history = [dict(m) for m in matches
                         if m['id'] != target['id'] and m['kickoff'] + PUBLICATION_BUFFER <= as_of]
              fixture = dict(target, kickoff=target['earliest'], score=None)
              forecast = engine.predict(fixture, history, as_of)
              if forecast is None:
                  return None, as_of, len(history)
              p = forecast['probabilities']
              if set(p) != set(ORDER) or any(not math.isfinite(p[k]) or not 0 <= p[k] <= 1 for k in ORDER) or abs(sum(p.values()) - 1) > 1e-5:
                  raise ValueError('Nieprawidłowe prawdopodobieństwa')
              used = forecast['home_match_ids'] + forecast['away_match_ids']
              if not set(used).issubset({m['id'] for m in history}):
                  raise ValueError('Model użył meczu spoza dozwolonej historii')
              return dict(p), as_of, len(history)
          
          
          def safety_tests(engine, groups):
              sample = groups[('E0', 2021)]
              target = sample[180]
              p, cutoff, _ = probabilities(engine, target, sample)
              assert p is not None
              mutated = copy.deepcopy(sample)
              # Target and EVERY result that was not yet available must have no effect.
              for m in mutated:
                  if m['id'] == target['id'] or m['kickoff'] + PUBLICATION_BUFFER > cutoff:
                      m['score'] = [40, 30]
              assert probabilities(engine, mutated[180], mutated)[0] == p
              assert target['earliest'] - cutoff == LEAD
              assert all(m['kickoff'] < cutoff for m in sample
                         if m['kickoff'] + PUBLICATION_BUFFER <= cutoff)
              assert probabilities(engine, sample[0], sample)[0] is None
              # An eligible earlier score must reach the model, otherwise this test could
              # falsely pass while ignoring all history.
              changed = copy.deepcopy(sample)
              prior = [m for m in changed if m['kickoff'] + PUBLICATION_BUFFER <= cutoff
                       and target['home_id'] in (m['home_id'], m['away_id'])]
              assert prior
              prior[-1]['score'] = [40, 0]
              assert probabilities(engine, target, changed)[0] != p
              # Result at the availability boundary is included; one microsecond later is not.
              boundary = dict(sample[0], id=9999, kickoff=cutoff - PUBLICATION_BUFFER)
              _, _, count_at = probabilities(engine, target, sample + [boundary])
              boundary['kickoff'] += timedelta(microseconds=1)
              _, _, count_after = probabilities(engine, target, sample + [boundary])
              assert count_at == count_after + 1
              print('Kontrole: ukrycie wyniku celu i przyszłości, wpływ historii, granica czasu, rozgrzewka — OK')
          
          
          def metrics(rows):
              if not rows:
                  raise ValueError('Brak ocenionych prognoz')
              n = len(rows)
              return {'n': n, 'hits': sum(r['hit'] for r in rows),
                      'accuracy': sum(r['hit'] for r in rows) / n,
                      'home_baseline_accuracy': sum(r['outcome'] == '1' for r in rows) / n,
                      'brier': sum(r['brier'] for r in rows) / n,
                      'uniform_brier': 2 / 3,
                      'log_loss': sum(r['log_loss'] for r in rows) / n,
                      'uniform_log_loss': math.log(3),
                      'picks': dict(Counter(r['pick'] for r in rows)),
                      'actual': dict(Counter(r['outcome'] for r in rows))}
          
          
          def run(engine, groups, provenance):
              rows, coverage = [], {}
              for (league, season), matches in sorted(groups.items()):
                  evaluated, skipped = [], []
                  for target in matches:
                      p, as_of, n_history = probabilities(engine, target, matches)
                      if p is None:
                          skipped.append(target['id'])
                          continue
                      outcome = engine.result_outcome(target['score'])
                      pick = max(ORDER, key=lambda k: p[k])
                      evaluated.append({
                          'league': league, 'season': season, 'match_id': target['id'],
                          'home': target['home'], 'away': target['away'],
                          'kickoff_earliest_utc': engine.iso(target['earliest']),
                          'kickoff_latest_utc': engine.iso(target['kickoff']),
                          'simulated_as_of_utc': engine.iso(as_of),
                          'history_matches': n_history, 'outcome': outcome,
                          'home_goals': target['score'][0], 'away_goals': target['score'][1],
                          **{f'p_{k}': p[k] for k in ORDER}, 'pick': pick,
                          'hit': int(pick == outcome),
                          'brier': sum((p[k] - int(k == outcome)) ** 2 for k in ORDER),
                          'log_loss': -math.log(max(1e-12, p[outcome])),
                      })
                  if not evaluated:
                      raise ValueError(f'Brak prognoz: {league}/{season}')
                  rows.extend(evaluated)
                  coverage[f'{league}/{season}'] = {
                      'input': len(matches), 'skipped_insufficient_history': len(skipped),
                      'skipped_match_ids': skipped, **metrics(evaluated)}
                  print(f'{league}/{season}: oceniono {len(evaluated)}, rozgrzewka {len(skipped)}', flush=True)
              overall = metrics(rows)
              summary = {
                  'type': 'retrospective_candidate_data_not_archived_forecasts',
                  'model_version': engine.MODEL_VERSION, 'engine_sha256': EXPECTED_ENGINE,
                  'snapshot': provenance, 'input_matches': 3800,
                  'current_season_excluded': 199, 'minimum_lead_hours_under_timezone_bounds': 168,
                  'simulated_publication_buffer_hours': 24,
                  'season_history_policy': 'reset each league/season, no cross-season pooling',
                  'timezone_bounds': ['UTC', 'Europe/London', 'Europe/Madrid'],
                  'overall': overall,
                  'per_league': {league: metrics([r for r in rows if r['league'] == league]) for league in ('E0', 'SP1')},
                  'per_season': coverage,
              }
              lines = ['# RZOTKIEWKA — test historyczny Anglii i Hiszpanii', '',
                       'Silnik 2.1.0 bez zmian. Pięć pełnych sezonów 2021/22–2025/26: 3800 rekordów wejściowych.',
                       'To retrospektywna symulacja na danych kandydackich; nie archiwalne prognozy ani trening.', '',
                       '| Próba | Oceniono | Trafność modelu | Zawsze gospodarz | Brier modelu | Brier równych szans |',
                       '|---|---:|---:|---:|---:|---:|']
              for label, item in [('Łącznie', overall)] + list(summary['per_league'].items()):
                  lines.append(f"| {label} | {item['n']} | {item['accuracy']:.2%} | {item['home_baseline_accuracy']:.2%} | {item['brier']:.5f} | {item['uniform_brier']:.5f} |")
              lines += ['', '## Sezony i pokrycie', '',
                        '| Liga / sezon | Wejście | Oceniono | Brak historii | Trafność | Zawsze gospodarz | Brier |',
                        '|---|---:|---:|---:|---:|---:|---:|']
              for label, item in coverage.items():
                  lines.append(f"| {label} | {item['input']} | {item['n']} | {item['skipped_insufficient_history']} | {item['accuracy']:.2%} | {item['home_baseline_accuracy']:.2%} | {item['brier']:.5f} |")
              lines += ['', '## Jak czytać wynik', '',
                        '- Trafność obu strategii liczymy na dokładnie tych samych ocenionych meczach.',
                        '- Brier ma skalę 0–2: mniej znaczy lepiej. Równe szanse to 1/3 na każdą klasę.',
                        '- Każdy sezon startuje bez historii. Model pomija początek sezonu do uzyskania wymaganej próbki.',
                        '- Całe 199 rekordów sezonu 2026/27 jest poza testem, w tym konflikt Bournemouth–Brentford i 29 nieuzgodnionych statusów.',
                        '', '## Czas i ograniczenia', '',
                        '- Dokumentacja dostawcy definiuje Date i Time, lecz nie potwierdza tutaj strefy czasowej: https://football-data.co.uk/notes.txt .',
                        '- Adapter rozpatruje interpretacje UTC, Europe/London i Europe/Madrid. To jawne założony przedział, nie ustalona strefa źródła.',
                        '- Punkt prognozy: najwcześniejszy możliwy start z przedziału minus 168 godzin. Do historii dopuszcza się tylko mecze z najpóźniejszym możliwym startem + 24 godziny <= punkt prognozy.',
                        '- Bufor 24h jest założeniem symulacji dostępności wyniku. Brak archiwalnych czasów publikacji, korekt i zmian terminarza; nie gwarantuje faktycznej dostępności w przeszłości.',
                        '- Model dostaje wyłącznie historię dopuszczoną przez adapter. Wynik ocenianego spotkania jest przed wywołaniem ukrywany.',
                        '- Kontrola struktury i skrótów plików nie jest niezależnym potwierdzeniem prawdziwości wszystkich wyników.',
                        '- Wersja 2.1 powstała po tych sezonach: test jest opisowy, może być obciążony doborem modelu. Nie jest nietkniętą próbą przyszłą.',
                        '- Brak zmian produkcji i predictions.json. Bez pomiaru ROI. Wniosek o wdrożeniu wymaga także testu przedmeczowego.',
                        '', f'SHA256 silnika: `{EXPECTED_ENGINE}`',
                        f"SHA256 migawki wejściowej: `{provenance['normalized_sha256']}`", '']
              OUT.mkdir(exist_ok=True)
              (OUT / 'RAPORT.md').write_text('\n'.join(lines), encoding='utf-8')
              (OUT / 'wyniki.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
              with (OUT / 'mecze.csv').open('w', newline='', encoding='utf-8-sig') as handle:
                  writer = csv.DictWriter(handle, fieldnames=list(rows[0]))
                  writer.writeheader()
                  writer.writerows(rows)
              print('\n'.join(lines[:11]))
              return summary
          
          
          def main():
              payload = json.loads(Path('snapshot_payload.json').read_text())
              data = gzip.decompress(base64.b64decode(payload['data_gzip_base64'], validate=True))
              if hashlib.sha256(data).hexdigest() != payload['provenance']['normalized_sha256']:
                  raise ValueError('Nieprawidłowy skrót danych')
              engine = load_engine(Path(os.environ.get('ENGINE_PATH', 'forecast_engine.py')))
              archive = Path('predictions.json')
              before = archive.read_bytes() if archive.exists() else None
              try:
                  groups = parse_snapshot(data)
                  safety_tests(engine, groups)
                  run(engine, groups, payload['provenance'])
              finally:
                  after = archive.read_bytes() if archive.exists() else None
                  if before != after:
                      raise RuntimeError('Archiwum predictions.json zostało zmienione')
          
          
          if __name__ == '__main__':
              main()
          PYTHON
      - name: Pokaz raport
        if: success()
        shell: bash
        run: cat raport_test_anglia_hiszpania/RAPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Zapisz wyniki testu
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RZOTKIEWKA_TEST_ANGLIA_HISZPANIA
          path: raport_test_anglia_hiszpania/
          if-no-files-found: error
          retention-days: 30
