name: RZOTKIEWKA - jednorazowa diagnoza 30 meczow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api_football_unmatched_once.yml'
permissions:
  contents: read
concurrency:
  group: rzotkiewka-one-shot-unmatched-2026
  cancel-in-progress: false
jobs:
  diagnose-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy offline
        run: python -m unittest discover -s tests -p 'test_api_football_unmatched_diagnosis.py' -v
      - name: Diagnostyka zagregowana dwoch lig i max 2 zapytania
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_unmatched_diagnosis.py --from-date 2026-08-21 --to-date 2026-08-31
