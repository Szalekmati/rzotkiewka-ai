name: RZOTKIEWKA - jednorazowo wyznacz najblizsze okna

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api_football_next_window_once.yml'

permissions:
  contents: read

concurrency:
  group: rzotkiewka-next-window-once-20261111
  cancel-in-progress: false

jobs:
  once:
    if: >-
      ${{ github.event.head_commit.message == 'RZOTKIEWKA: jednorazowo sprawdz otwarcie kolejnych okien badania lig' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy offline przed odczytem API
        run: python -m unittest discover -s tests -p 'test_api_football_next_window.py' -v
      - name: Ustal dwie najblizsze daty badan w czasie polskim
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_next_window.py
