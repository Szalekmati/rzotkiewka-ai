name: RZOTKIEWKA - jednorazowy audyt 7 lig API-FOOTBALL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api_football_leagues_once.yml'
permissions:
  contents: read
concurrency:
  group: rzotkiewka-api-football-leagues-one-shot
  cancel-in-progress: false
jobs:
  one-shot-catalog-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy offline (bez API)
        run: python -m unittest discover -s tests -p 'test_api_football_league_catalog.py' -v
      - name: Jedno zapytanie o katalog 2026
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_league_catalog.py --season 2026
