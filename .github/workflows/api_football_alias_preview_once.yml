name: RZOTKIEWKA - jednorazowy podglad propozycji aliasow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api_football_alias_preview_once.yml'

permissions:
  contents: read

concurrency:
  group: rzotkiewka-alias-candidates-one-shot-20261111
  cancel-in-progress: false

jobs:
  preview-once:
    if: >-
      ${{ github.event.head_commit.message == 'RZOTKIEWKA: jednorazowo sprawdz kandydatow tozsamosci klubow' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy offline przed uzyciem platnego API
        run: python -m unittest discover -s tests -p 'test_api_football_alias_candidates.py' -v
      - name: Jednorazowy odczyt dwoch lig w ramach limitu
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_alias_candidates.py --from-date 2026-08-21 --to-date 2026-08-31
