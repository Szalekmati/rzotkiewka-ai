name: RZOTKIEWKA - kontrola strony i darmowych prognoz

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/test_site_integrity.py'
      - 'tests/test_mobile_nav.cjs'
      - 'tests/test_archive_fail_closed.mjs'
      - 'tests/test_prediction_passport.mjs'
      - 'tests/test_lab_schedule.py'
      - 'tests/test_lab_diagnostics.py'
      - '.github/workflows/diagnostyka_terminarza_lab.yml'
      - '.github/workflows/test_przedmeczowy.yml'
      - '.github/workflows/quality_site.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'predictions.json'
      - 'tips.json'
      - 'forecast_engine.py'
      - 'tests/test_site_integrity.py'
      - 'tests/test_mobile_nav.cjs'
      - 'tests/test_archive_fail_closed.mjs'
      - 'tests/test_prediction_passport.mjs'
      - 'tests/test_lab_schedule.py'
      - 'tests/test_lab_diagnostics.py'
      - '.github/workflows/diagnostyka_terminarza_lab.yml'
      - '.github/workflows/test_przedmeczowy.yml'
      - '.github/workflows/quality_site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wymagaj Node.js do sprawdzenia JavaScript
        run: node --version
      - name: Testy archiwum, darmowych prognoz i JavaScript
        run: python -m unittest discover -s tests -p 'test_site_integrity.py' -v
      - name: Test zablokowania niespojnego archiwum (Node.js, offline)
        run: node --test tests/test_archive_fail_closed.mjs
      - name: Paszport prognozy - rzeczywiste pola i bezpieczny brak danych (Node.js, offline)
        run: node --test tests/test_prediction_passport.mjs
      - name: Chromium - kontrola mobilnych zakladek (320-720 px)
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          node tests/test_mobile_nav.cjs
      - name: Zapisz podglady mobilne
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rzotkiewka-mobile-nav-preview
          path: mobile-nav-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Testy niezmiennosci harmonogramu i modeli LAB
        run: python -m unittest discover -s tests -p 'test_lab_schedule.py' -v
      - name: Testy diagnostyki terminarza LAB (offline)
        run: python -m unittest discover -s tests -p 'test_lab_diagnostics.py' -v
