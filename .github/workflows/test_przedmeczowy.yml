          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rzotkiewka_forward'
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              for name in archive.namelist():
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('Nieprawidlowa sciezka')
              archive.extractall(target)
      - name: Testy poprawnosci zapisu i rozliczania
        run: python -m unittest discover -s "$RUNNER_TEMP/rzotkiewka_forward" -p 'test_*.py' -v
      - name: Zapisz prognozy i rozlicz zakonczone mecze
        id: observe
        run: python "$RUNNER_TEMP/rzotkiewka_forward/forward.py"
      - name: Zapisz obserwacje w historii repozytorium
        if: ${{ always() && steps.observe.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f lab_forward/ledger.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f lab_forward/published_commit.txt
          git add -- lab_forward/
          if ! git diff --cached --quiet; then
            git commit -m 'RZOTKIEWKA: prognozy i wyniki testu LAB [skip ci]'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
          cat lab_forward/RAPORT.md >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD > lab_forward/published_commit.txt
      - name: Pobierz raport i archiwum obserwacji
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RZOTKIEWKA_TEST_PRZEDMECZOWY
          path: lab_forward/
          if-no-files-found: warn
          retention-days: 90
