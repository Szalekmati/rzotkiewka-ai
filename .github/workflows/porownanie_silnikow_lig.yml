                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('Nieprawidlowa sciezka')
              archive.extractall(target)
      - name: Sprawdz kalibrator i odciecie przyszlych wynikow
        run: python -m unittest discover -s "$RUNNER_TEMP/rzotkiewka_porownanie" -p 'test_*.py' -v
      - name: Porownaj modele na wspolnej probce
        run: |
          python "$RUNNER_TEMP/rzotkiewka_porownanie/compare.py" --engine "$GITHUB_WORKSPACE/forecast_engine.py" --out "$RUNNER_TEMP/raport_porownanie_lig"
          cat "$RUNNER_TEMP/raport_porownanie_lig/RAPORT.md" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD > "$RUNNER_TEMP/raport_porownanie_lig/repo_commit.txt"
      - name: Udostepnij raport
        uses: actions/upload-artifact@v6
        with:
          name: RZOTKIEWKA_POROWNANIE_SILNIKOW_LIG
          path: ${{ runner.temp }}/raport_porownanie_lig/
          if-no-files-found: error
          retention-days: 30
