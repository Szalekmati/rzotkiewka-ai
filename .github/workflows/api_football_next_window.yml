name: RZOTKIEWKA - nastepne okno badania dwoch lig

on:
  pull_request:
    branches: [main]
    paths:
      - 'api_football_next_window.py'
      - 'tests/test_api_football_next_window.py'
      - '.github/workflows/api_football_next_window.yml'
  push:
    branches: [main]
    paths:
      - 'api_football_next_window.py'
      - 'tests/test_api_football_next_window.py'
      - '.github/workflows/api_football_next_window.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rzotkiewka-next-window-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdz daty i strefy bez platnego API
        run: python -m unittest discover -s tests -p 'test_api_football_next_window.py' -v

  manual-source-read:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recznie sprawdz najblizsze okna (maks. 2 zapytania)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_next_window.py
