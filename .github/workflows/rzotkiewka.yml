name: RZOTKIEWKA - archiwum prognoz
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rzotkiewka-forecast-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz mecze i rozlicz prognozy
        run: python forecast_engine.py
      - name: Zapisz nowe prognozy w historii GitHuba
        run: |
          git config user.name 'rzotkiewka-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add predictions.json
          if ! git diff --cached --quiet; then
            git commit -m 'RZOTKIEWKA: nowa prognoza / wynik'
            git push
          fi
