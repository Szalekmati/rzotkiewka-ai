name: RZOTKIEWKA - kontrola identyfikatorow druzyn
on:
  pull_request:
    branches: [main]
    paths:
      - 'api_football_team_id_audit.py'
      - 'tests/test_api_football_team_id_audit.py'
      - '.github/workflows/api_football_team_id_audit.yml'
  push:
    branches: [main]
    paths:
      - 'api_football_team_id_audit.py'
      - 'tests/test_api_football_team_id_audit.py'
      - '.github/workflows/api_football_team_id_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rzotkiewka-team-id-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy bez uzycia API
        run: python -m unittest discover -s tests -p 'test_api_football_team_id_audit.py' -v
  check-ids:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: tests-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reczny test dwoch lig - max 6 zapytan
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_team_id_audit.py
