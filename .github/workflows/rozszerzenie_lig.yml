# Audyt wykonany 2026-11-09: pl/2026 380 wpisow, 71 wynikow, 22 mecze diagnostyczne;
# la1/2026 380 wpisow, 99 wynikow, 50 meczow diagnostycznych.
# Wyniki moga sie zmieniac. Diagnostyka; nie wlacza lig do produkcji.
name: "RZOTKIEWKA - audyt rozszerzenia lig"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Przygotuj audyt
        shell: python
        run: |
          import base64, hashlib, os
          from pathlib import Path
          code = base64.b64decode('')
          assert hashlib.sha256(code).hexdigest() == '7386f2d3f80a0d5ca88037efb3a22413fabcaa7f3a09c73e97890c50d9c7c65a'
          path = Path(os.environ['RUNNER_TEMP'])/'audit_expansion.py'
          path.write_bytes(code)
      - name: Sprawdz dane lig bez zmian produkcji
        run: python "$RUNNER_TEMP/audit_expansion.py" --engine "$GITHUB_WORKSPACE/forecast_engine.py" --output "$RUNNER_TEMP/rozszerzenie_lig"
      - name: Pokaz podsumowanie
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'rozszerzenie_lig/RAPORT.md'
          if path.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as output:
                  output.write(path.read_text(encoding='utf-8'))
      - name: Raport i dane do pobrania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RZOTKIEWKA_ROZSZERZENIE_LIG
          path: ${{ runner.temp }}/rozszerzenie_lig/
          if-no-files-found: error
          retention-days: 30
