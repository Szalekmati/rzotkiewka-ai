name: RZOTKIEWKA - Audyt 2.3 (offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audyt:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wykonaj audyt 2.3
        run: python audyt_23.py --input mecze_test_22.csv --output raporty_23
      - name: Zapisz raport do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: RZOTKIEWKA-RAPORT-23
          path: raporty_23/
