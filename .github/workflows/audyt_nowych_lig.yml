name: RZOTKIEWKA - audyt kandydatow nowych lig

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'league_candidates.py'
      - 'tests/test_league_candidates.py'
      - 'league_shortcuts_2025.py'
      - 'tests/test_league_shortcuts_2025.py'
      - 'openfootball_history_audit.py'
      - 'tests/test_openfootball_history_audit.py'
      - 'ucl_deep_audit.py'
      - 'tests/test_ucl_deep_audit.py'
      - '.github/workflows/audyt_nowych_lig.yml'
  push:
    branches: [main]
    paths:
      - 'league_candidates.py'
      - 'tests/test_league_candidates.py'
      - 'league_shortcuts_2025.py'
      - 'tests/test_league_shortcuts_2025.py'
      - 'openfootball_history_audit.py'
      - 'tests/test_openfootball_history_audit.py'
      - 'ucl_deep_audit.py'
      - 'tests/test_ucl_deep_audit.py'
      - '.github/workflows/audyt_nowych_lig.yml'
  schedule:
    # Niedziela 06:23 UTC; zdarzenia scheduled moga sie opoznic.
    - cron: '23 6 * * 0'

permissions:
  contents: read

concurrency:
  group: rzotkiewka-audyt-lig
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy analizy jakosci lig (bez internetu)
        run: python -m unittest discover -s tests -p 'test_league_candidates.py' -v
      - name: Testy pogłębionego audytu Ligi Mistrzow (offline)
        run: python -m unittest discover -s tests -p 'test_ucl_deep_audit.py' -v
      - name: Testy spisu identyfikatorow lig 2025 (offline)
        run: python -m unittest discover -s tests -p 'test_league_shortcuts_2025.py' -v
      - name: Testy niezaleznej historii OpenFootball 2025/26 (offline)
        run: python -m unittest discover -s tests -p 'test_openfootball_history_audit.py' -v
      - name: Zbadaj zarchiwizowane wyniki OpenFootball CC0 (tylko odczyt)
        if: github.event_name != 'pull_request'
        run: python openfootball_history_audit.py
      - name: Sprawdz historyczne skroty lig 2025 (jeden odczyt API)
        if: github.event_name != 'pull_request'
        run: python league_shortcuts_2025.py
      - name: Przeprowadz audyt 3 kandydatow (tylko odczyt)
        if: github.event_name != 'pull_request'
        run: python league_candidates.py
      - name: Sprawdz 3 sezony Ligi Mistrzow (tylko odczyt)
        if: github.event_name != 'pull_request'
        run: python ucl_deep_audit.py
      - name: Raport i metryki do pobrania
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RZOTKIEWKA_AUDYT_KANDYDATOW_LIG
          path: league_audit/
          if-no-files-found: warn
          retention-days: 21
