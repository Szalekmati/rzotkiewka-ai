name: RZOTKIEWKA - jednorazowy test terminarza API-FOOTBALL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api_football_fixtures_one_shot.yml'
permissions:
  contents: read
concurrency:
  group: rzotkiewka-api-football-one-shot-fixtures
  cancel-in-progress: false
jobs:
  fixtures-one-shot:
    if: >-
      ${{ github.event.head_commit.message == 'RZOTKIEWKA: poprawiony jednorazowy test terminarza API-Football 2026-11-07' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdz testy offline
        run: python -m unittest discover -s tests -p 'test_api_football_probe.py' -v
      - name: Jedno zapytanie o terminarz Premier League
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_probe.py --mode fixtures --league 39 --season 2026 --date 2026-11-07
