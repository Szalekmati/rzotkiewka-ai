name: "RZOTKIEWKA - duzy test 5 sezonow"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Przygotuj osobny test
        shell: python
        run: |
          import os, base64, zlib, hashlib
          from pathlib import Path
          blob = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(blob).hexdigest() == '57bd4e7f0cafccfb446808a0524ff7ec1630621f84b2f8c154db44b3f46c8884'
          (Path(os.environ["RUNNER_TEMP"]) / "expanded_backtest.py").write_bytes(blob)
      - name: Pobierz historie i ocen silnik repo
        run: |
          python "$RUNNER_TEMP/expanded_backtest.py" --engine "$GITHUB_WORKSPACE/forecast_engine.py" --out "$RUNNER_TEMP/duzy_test"
          cat "$RUNNER_TEMP/duzy_test/RAPORT.md" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD > "$RUNNER_TEMP/duzy_test/repo_commit.txt"
      - name: Raport i dane do pobrania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RZOTKIEWKA_DUZY_TEST_5_SEZONOW
          path: ${{ runner.temp }}/duzy_test/
          if-no-files-found: warn
          retention-days: 30
