name: RZOTKIEWKA - potwierdzenie nazw RC Deportivo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api_football_official_roster_deportivo_once.yml'

permissions:
  contents: read

concurrency:
  group: rzotkiewka-official-deportivo-once-20261111
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      ${{ github.event.head_commit.message == 'RZOTKIEWKA: jednorazowe potwierdzenie listy klubow po wyjasnieniu RC Deportivo' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Najpierw 16 testow offline
        run: python -m unittest discover -s tests -p 'test_api_football_official_roster.py' -v
      - name: Audyt oficjalnych nazw i dwoch katalogow klubow
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_football_official_roster.py
