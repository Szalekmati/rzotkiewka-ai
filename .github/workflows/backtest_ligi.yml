      - name: Sprawdz adapter i odciecie przyszlych wynikow
        env:
          RZOTKIEWKA_ENGINE_PATH: ${{ github.workspace }}/forecast_engine.py
        run: python -m unittest discover -s "$RUNNER_TEMP/rzotkiewka_backtest_ligi" -p 'test_*.py' -v
      - name: Ocen obecny silnik
        run: |
          python "$RUNNER_TEMP/rzotkiewka_backtest_ligi/evaluate.py" --engine "$GITHUB_WORKSPACE/forecast_engine.py" --out "$RUNNER_TEMP/raport_silnika_lig" --lead-hours 168
          cat "$RUNNER_TEMP/raport_silnika_lig/RAPORT.md" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD > "$RUNNER_TEMP/raport_silnika_lig/repo_commit.txt"
      - name: Udostepnij raporty
        uses: actions/upload-artifact@v6
        with:
          name: RZOTKIEWKA_TEST_SILNIKA_LIG
          path: ${{ runner.temp }}/raport_silnika_lig/
          if-no-files-found: error
          retention-days: 30
